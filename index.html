<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="home.pageTitle">SplineXR</title>
<meta name="description" content="Explore Spline 3D scenes in the browser or in VR on a Meta Quest headset.">
<!-- Preview tags: rewritten for each /s/<id> link (and the visitor's language) by netlify/edge-functions/og.js -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="SplineXR">
<meta property="og:url" content="https://spline-xr.netlify.app/">
<meta property="og:title" content="SplineXR — your Spline scenes in VR">
<meta property="og:description" content="Explore Spline 3D scenes in the browser or in VR on a Meta Quest headset.">
<meta property="og:image" content="https://spline-xr.netlify.app/og-default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://spline-xr.netlify.app/og-default.jpg">
<style>
:root {
  --bg: #06060f;
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.09);
  --accent: #7b6ef6;
  --accent2: #3ecfcf;
  --text: #e8e8f0;
  --muted: #7a7a95;
  --danger: #f05b5b;
  --r: 14px;
  --font: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: var(--font); color: var(--text) }

/* --- Animated background --- */
#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none }

/* --- Home screen --- */
#config {
  position: fixed; inset: 0; z-index: 10;
  overflow-y: auto; padding: 32px 16px 60px;
  display: flex; justify-content: center;
  transition: opacity .5s, transform .5s;
}
.home { width: 100%; max-width: 560px; margin: auto 0; display: flex; flex-direction: column; gap: 16px }
.home .card { max-width: none }
#config.out { opacity: 0; pointer-events: none; transform: scale(.96) }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  backdrop-filter: blur(24px);
  padding: 28px 28px 24px;
  width: 100%; max-width: 420px;
  display: flex; flex-direction: column; gap: 20px;
}

.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.logo-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px var(--accent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }

h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2 }
h1 span { color: var(--accent) }

.section-label {
  font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}

.lead { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 8px }
.help { font-size: 12px; color: var(--muted); line-height: 1.5 }
.help code { font-family: monospace; color: var(--text) }
.help b { color: var(--text); font-weight: 600 }

.home-top { display: flex; align-items: center; justify-content: space-between; gap: 12px }

/* --- Language switch (from Spline AR) --- */
.lang-switch { display: inline-flex; padding: 2px; border-radius: 100px; background: var(--surface);
  border: 1px solid var(--border) }
.lang-switch button { font: 600 11px/1 var(--font, inherit); letter-spacing: .06em; padding: 5px 9px;
  border: 0; border-radius: 100px; background: transparent; color: var(--muted); cursor: pointer }
.lang-switch button:hover { color: var(--text) }
.lang-switch button[aria-pressed="true"] { background: rgba(123,110,246,.2); color: var(--text) }
#hud .lang-switch { background: rgba(6,6,15,.8); backdrop-filter: blur(20px) }

/* --- Scene form --- */
.scene-form { display: flex; flex-direction: column; gap: 12px }
.scene-form .section-label { margin: 0 }
.field { display: flex; flex-direction: column; gap: 6px }
.field > span { font-size: 12px; font-weight: 500; color: var(--text) }
.field em { font-style: normal; color: var(--muted); font-weight: 400 }
input[type=text] {
  width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 13px;
  outline: none; transition: border-color .15s;
  font-family: monospace;
}
input[type=text].plain { font-family: var(--font) }
input[type=text]::placeholder { color: var(--muted) }
input[type=text]:focus { border-color: var(--accent) }
input[type=text].error { border-color: var(--danger); animation: shake .3s }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
.form-actions { display: flex; gap: 8px }
.form-actions .btn-primary { flex: 1 }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: none; border-radius: 10px; padding: 10px 16px;
  font: 600 13px var(--font); cursor: pointer; transition: all .15s;
  white-space: nowrap; text-decoration: none;
}
.btn-primary { background: var(--accent); color: #fff }
.btn-primary:hover { background: #6b5ef0; transform: translateY(-1px) }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none }
.btn-sm { padding: 7px 12px; font-size: 12px }
.btn[hidden] { display: none }
.btn-ghost { background: var(--surface); border: 1px solid var(--border); color: var(--text) }
.btn-ghost:hover { background: rgba(255,255,255,.07) }
.btn-danger { background: rgba(240,91,91,.15); border: 1px solid rgba(240,91,91,.25); color: var(--danger) }
.btn-danger:hover { background: rgba(240,91,91,.25) }

/* --- Lists: Get started / My creations (from Spline AR) --- */
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.list-head .section-label { margin: 0 }
.tag { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent2);
  background: rgba(62,207,207,.1); border: 1px solid rgba(62,207,207,.25); border-radius: 100px; padding: 2px 8px }
.works { display: flex; flex-direction: column; gap: 8px }
.work { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center;
  padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface) }
.work.current { border-color: rgba(123,110,246,.5); background: rgba(123,110,246,.08) }
.work-thumb { width: 72px; height: 38px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.04);
  display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 16px }
.work-thumb img { width: 100%; height: 100%; object-fit: cover }
.work-info { min-width: 0 }
.work-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.work-meta { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.work-meta { font-family: var(--font) }
.work-actions { display: flex; gap: 6px }
.work-actions .is-current { pointer-events: none; opacity: .5 }
.works-empty { padding: 4px 2px }
@media (max-width: 520px) {
  .work { grid-template-columns: 72px 1fr }
  .work-actions { grid-column: 1 / -1; flex-wrap: wrap }
}

/* --- Loading --- */
#loading {
  position: fixed; inset: 0; z-index: 20;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: rgba(6,6,15,.85); backdrop-filter: blur(12px);
}
#loading.visible { display: flex }
.spinner {
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid var(--border);
  border-top-color: var(--accent); border-right-color: var(--accent2);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }
#load-msg { font-size: 13px; color: var(--muted) }

/* --- HUD --- */
#hud {
  position: fixed; bottom: 28px; left: 0; right: 0; z-index: 20;
  display: none; justify-content: center; gap: 12px; padding: 0 16px;
}
#hud.visible { display: flex }
.hud-btn {
  display: flex; align-items: center; gap: 8px;
  background: rgba(6,6,15,.8); border: 1px solid var(--border);
  backdrop-filter: blur(20px); border-radius: 100px;
  padding: 12px 22px; font-size: 13px; font-weight: 600;
  color: var(--text); cursor: pointer;
  transition: all .2s;
}
.hud-btn:hover { border-color: var(--accent); color: var(--accent) }
.hud-btn:disabled { opacity: .4; cursor: not-allowed }
#btn-reset { background: rgba(62,207,207,.1); border-color: rgba(62,207,207,.3); color: var(--accent2) }
#btn-reset:hover { background: rgba(62,207,207,.2) }
#btn-vr { background: rgba(123,110,246,.15); border-color: rgba(123,110,246,.4); color: var(--accent) }
#btn-vr:hover:not(:disabled) { background: rgba(123,110,246,.3) }

/* --- Shareable link --- */
#share-bar {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 20;
  display: none; align-items: center; gap: 10px;
  max-width: calc(100% - 32px);
  background: rgba(6,6,15,.8); border: 1px solid var(--border);
  backdrop-filter: blur(20px); border-radius: 100px;
  padding: 6px 6px 6px 18px;
}
#share-bar.visible { display: flex }
#share-label { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; flex-shrink: 0 }
#share-source { flex-shrink: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 0 4px; white-space: nowrap }
#share-source:hover { color: var(--accent2) }
#share-source[hidden] { display: none }
#share-url {
  font-family: monospace; font-size: 13px; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all;
  text-decoration: none; min-width: 0;
}
#share-url:hover { color: var(--accent) }
#share-copy {
  flex-shrink: 0; border: 1px solid rgba(123,110,246,.4); background: rgba(123,110,246,.15);
  color: var(--accent); border-radius: 100px; padding: 8px 16px;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: all .2s;
}
#share-copy:hover { background: rgba(123,110,246,.3) }
#share-thumb {
  flex-shrink: 0; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 100px; width: 38px; height: 36px; font-size: 14px; cursor: pointer; transition: all .2s;
}
#share-thumb:hover:not(:disabled) { border-color: var(--accent) }
#share-thumb:disabled { opacity: .6; cursor: default }
#share-copy.done { border-color: rgba(62,207,207,.4); background: rgba(62,207,207,.15); color: var(--accent2) }
@media (max-width: 560px) { #share-label { display: none } }

/* --- Error --- */
#err-bar {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px);
  z-index: 30; background: rgba(240,91,91,.9); border-radius: 10px;
  padding: 10px 18px; font-size: 13px; font-weight: 500;
  transition: transform .3s; max-width: 360px; text-align: center;
}
#err-bar.visible { transform: translateX(-50%) translateY(0) }

#xr-canvas {
  position: fixed; inset: 0; z-index: 1;
  display: none;
}
#xr-canvas.active { display: block }

/* Preview without a headset: official Spline runtime */
.spline-canvas { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; display: block; outline: none }
.hud-btn[hidden] { display: none }

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="xr-canvas"></canvas>

<!-- Home -->
<div id="config">
  <main class="home">
    <div class="card">
      <div class="home-top">
        <div class="logo"><span class="logo-dot"></span>SplineXR</div>
        <div id="lang-slot"></div>
      </div>
      <div>
        <h1 data-i18n-html="home.title"></h1>
        <p class="lead" data-i18n="home.lead"></p>
      </div>
      <form id="scene-form" class="scene-form" novalidate>
        <div class="section-label" id="form-label" data-i18n="form.new"></div>
        <label class="field">
          <span data-i18n="form.url"></span>
          <input type="text" id="url-input" placeholder="https://prod.spline.design/…/scene.splinecode" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span><span data-i18n="form.title"></span> <em data-i18n="form.optional"></em></span>
          <input type="text" id="title-input" class="plain" maxlength="80" data-i18n-placeholder="form.titlePlaceholder" autocomplete="off" />
        </label>
        <label class="field">
          <span><span data-i18n="form.file"></span> <em data-i18n="form.fileOptional"></em></span>
          <input type="text" id="file-input" placeholder="https://app.spline.design/file/…" autocomplete="off" spellcheck="false" />
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="go-btn" data-i18n="form.play"></button>
          <button type="button" class="btn btn-ghost" id="cancel-edit" hidden data-i18n="form.cancel"></button>
        </div>
        <p class="help" data-i18n-html="form.help"></p>
      </form>
    </div>

    <div class="card">
      <div class="list-head">
        <div class="section-label" data-i18n="templates.title"></div>
        <span class="tag" data-i18n="templates.tag"></span>
      </div>
      <div id="examples" class="works"></div>
      <p class="help" data-i18n="templates.help"></p>
    </div>

    <div class="card">
      <div class="list-head">
        <div class="section-label" data-i18n="works.title"></div>
        <span id="count" class="tag" hidden></span>
      </div>
      <div id="works" class="works"></div>
      <p id="list-help" class="help"></p>
    </div>
  </main>
</div>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <div id="load-msg" data-i18n="loading.default"></div>
</div>

<!-- HUD -->
<div id="hud">
  <button class="hud-btn" id="btn-back" data-i18n="hud.home"></button>
  <button class="hud-btn" id="btn-reset" data-i18n="hud.reset"></button>
  <button class="hud-btn" id="btn-vr" disabled data-i18n="hud.enterVr"></button>
</div>

<div id="share-bar">
  <span id="share-label" data-i18n="share.label"></span>
  <a id="share-url" href="#" target="_blank" rel="noopener"></a>
  <a id="share-source" target="_blank" rel="noopener" data-i18n-title="actions.sourceTitle" hidden>Spline ↗</a>
  <button id="share-thumb" data-i18n-title="share.thumbTitle">📷</button>
  <button id="share-copy" data-i18n="share.copy"></button>
</div>

<div id="err-bar"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SplineXR</title>
<style>
:root {
  --bg: #06060f;
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.09);
  --accent: #7b6ef6;
  --accent2: #3ecfcf;
  --text: #e8e8f0;
  --muted: #7a7a95;
  --danger: #f05b5b;
  --r: 14px;
  --font: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0 }
html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: var(--font); color: var(--text) }

/* --- Fond animé --- */
#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none }

/* --- Config screen --- */
#config {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px;
  transition: opacity .5s, transform .5s;
}
#config.out { opacity: 0; pointer-events: none; transform: scale(.96) }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  backdrop-filter: blur(24px);
  padding: 28px 28px 24px;
  width: 100%; max-width: 420px;
  display: flex; flex-direction: column; gap: 20px;
}

.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.logo-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px var(--accent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }

h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2 }
h1 span { color: var(--accent) }

.section-label {
  font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}

.scene-list { display: flex; flex-direction: column; gap: 6px }
.scene-btn {
  display: flex; align-items: center; justify-content: space-between;
  background: transparent; border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px;
  cursor: pointer; color: var(--text); text-align: left;
  transition: background .15s, border-color .15s;
}
.scene-btn:hover { background: rgba(123,110,246,.08); border-color: var(--accent) }
.scene-btn:active { transform: scale(.99) }
.scene-name { font-size: 13px; font-weight: 500 }
.scene-slug { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: monospace }
.scene-arrow { color: var(--accent); font-size: 11px; opacity: .7 }

.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px }
.divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border) }

.url-row { display: flex; gap: 8px }
input[type=text] {
  flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 13px;
  outline: none; transition: border-color .15s;
  font-family: monospace;
}
input[type=text]::placeholder { color: var(--muted) }
input[type=text]:focus { border-color: var(--accent) }
input[type=text].error { border-color: var(--danger); animation: shake .3s }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  border: none; border-radius: 10px; padding: 10px 16px;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff }
.btn-primary:hover { background: #6b5ef0; transform: translateY(-1px) }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none }
.btn-sm { padding: 7px 12px; font-size: 12px }
.btn-ghost { background: var(--surface); border: 1px solid var(--border); color: var(--text) }
.btn-ghost:hover { background: rgba(255,255,255,.07) }
.btn-danger { background: rgba(240,91,91,.15); border: 1px solid rgba(240,91,91,.25); color: var(--danger) }
.btn-danger:hover { background: rgba(240,91,91,.25) }

#save-section { display: none }
#my-scenes-section { display: none }
.saved-scene { display: flex; align-items: center; gap: 8px }
.saved-scene-url { flex:1; font-size: 11px; color: var(--muted); font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

/* --- Loading --- */
#loading {
  position: fixed; inset: 0; z-index: 20;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: rgba(6,6,15,.85); backdrop-filter: blur(12px);
}
#loading.visible { display: flex }
.spinner {
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid var(--border);
  border-top-color: var(--accent); border-right-color: var(--accent2);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }
#load-msg { font-size: 13px; color: var(--muted) }

/* --- HUD --- */
#hud {
  position: fixed; bottom: 28px; left: 0; right: 0; z-index: 20;
  display: none; justify-content: center; gap: 12px;
}
#hud.visible { display: flex }
.hud-btn {
  display: flex; align-items: center; gap: 8px;
  background: rgba(6,6,15,.8); border: 1px solid var(--border);
  backdrop-filter: blur(20px); border-radius: 100px;
  padding: 12px 22px; font-size: 13px; font-weight: 600;
  color: var(--text); cursor: pointer;
  transition: all .2s;
}
.hud-btn:hover { border-color: var(--accent); color: var(--accent) }
.hud-btn:disabled { opacity: .4; cursor: not-allowed }
#btn-reset { background: rgba(62,207,207,.1); border-color: rgba(62,207,207,.3); color: var(--accent2) }
#btn-reset:hover { background: rgba(62,207,207,.2) }
#btn-vr { background: rgba(123,110,246,.15); border-color: rgba(123,110,246,.4); color: var(--accent) }
#btn-vr:hover:not(:disabled) { background: rgba(123,110,246,.3) }

/* --- Erreur --- */
#err-bar {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px);
  z-index: 30; background: rgba(240,91,91,.9); border-radius: 10px;
  padding: 10px 18px; font-size: 13px; font-weight: 500;
  transition: transform .3s; max-width: 360px; text-align: center;
}
#err-bar.visible { transform: translateX(-50%) translateY(0) }

#xr-canvas {
  position: fixed; inset: 0; z-index: 1;
  display: none;
}
#xr-canvas.active { display: block }

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="xr-canvas"></canvas>

<!-- Config -->
<div id="config">
  <div class="card">
    <div class="logo"><span class="logo-dot"></span>SplineXR</div>
    <div>
      <h1>Explore en <span>VR</span><br>tes scènes Spline</h1>
    </div>

    <div>
      <div class="section-label">Scènes exemples</div>
      <div class="scene-list" id="scene-list"></div>
    </div>

    <div class="divider">ou entre une URL</div>

    <div class="url-row">
      <input type="text" id="url-input" placeholder="https://prod.spline.design/…/scene.splinecode" />
      <button class="btn btn-sm btn-ghost" id="save-btn" title="Sauvegarder">＋</button>
    </div>
    <button class="btn btn-primary" id="go-btn">Charger la scène →</button>

    <div id="save-section">
      <div class="section-label">Mes scènes</div>
      <div id="my-scenes-list" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
  </div>
</div>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <div id="load-msg">Chargement…</div>
</div>

<!-- HUD -->
<div id="hud">
  <button class="hud-btn" id="btn-back">← Changer de scène</button>
  <button class="hud-btn" id="btn-reset">⌂ Reset position</button>
  <button class="hud-btn" id="btn-vr" disabled>🥽 Entrer en VR</button>
</div>

<div id="err-bar"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>

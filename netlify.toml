[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The Spline CDN sends no CORS headers: scenes are loaded through this proxy
[[redirects]]
  from = "/spline-proxy/*"
  to = "https://prod.spline.design/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-Forwarded-Host = "prod.spline.design"

# Shareable links: /s/<Spline ID> serves the app
[[redirects]]
  from = "/s/*"
  to = "/index.html"
  status = 200

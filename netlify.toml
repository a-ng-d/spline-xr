[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/spline-proxy/*"
  to = "https://prod.spline.design/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-Forwarded-Host = "prod.spline.design"

# Liens partageables : /s/<identifiant Spline> sert l'application
[[redirects]]
  from = "/s/*"
  to = "/index.html"
  status = 200
